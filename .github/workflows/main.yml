name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make clean && make

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ./build/helium
          git commit -m "Build: compiled helium binary"
          git push
        if: github.event_name == 'push'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: helium
          path: helium
