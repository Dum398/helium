name: Build C Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with GCC
        run: gcc ./src/main.c -o helium

      - name: Commit and push artifact
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helium
          git commit -m "Build: compiled helium binary"
          git push https://x-access-token:${{ secrets.GH_ACTIONS_TOKEN }}@github.com/Dum398/helium.git
        if: github.event_name == 'push'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helium
          path: helium
